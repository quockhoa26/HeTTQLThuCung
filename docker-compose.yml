# ==============================================================================
# HỆ THỐNG QUẢN LÝ THÚ CƯNG (PET MANAGEMENT SYSTEM)
# Docker Compose Production-Ready & Hardened Architecture
# ==============================================================================

version: '3.8'

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  monitor-net:
    driver: bridge

volumes:
  pgdata:
    driver: local
  app_logs:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database (Storage & Data Integrity)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net
      - monitor-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. pgAdmin 4 (Database Management Web UI)
  # ----------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: pet-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 3. Backend API Service (Node.js + Express + TypeScript)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pet-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      LOG_DIR: /app/logs
    volumes:
      - app_logs:/app/logs
    networks:
      - frontend-net
      - backend-net
      - monitor-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 4. Frontend UI Service (React + Vite + TypeScript)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pet-frontend
    restart: unless-stopped
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 5. Nginx Reverse Proxy (Gateway, Security Headers & Routing)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: pet-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/custom_50x.html:/usr/share/nginx/html/custom_50x.html:ro
      - nginx_logs:/var/log/nginx
    networks:
      - frontend-net
      - monitor-net
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 6. Database Exporter (PostgreSQL Metrics for Prometheus)
  # ----------------------------------------------------------------------------
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: pet-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
    networks:
      - backend-net
      - monitor-net
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 7. Nginx Exporter (Nginx Metrics for Prometheus)
  # ----------------------------------------------------------------------------
  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: pet-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx:80/stub_status
    networks:
      - monitor-net
    depends_on:
      - nginx

  # ----------------------------------------------------------------------------
  # 8. Prometheus (Metrics Scraper & Time-Series DB)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: pet-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - monitor-net

  # ----------------------------------------------------------------------------
  # 9. Grafana (Metrics & Logs Visual Dashboard)
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: pet-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: Admin@123
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitor-net
    depends_on:
      - prometheus
      - loki

  # ----------------------------------------------------------------------------
  # 10. Loki (Centralized Log Aggregation)
  # ----------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.8
    container_name: pet-loki
    restart: unless-stopped
    ports:
      - "${LOKI_PORT:-3100}:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - monitor-net

  # ----------------------------------------------------------------------------
  # 11. Promtail (Log Collector & Shipper to Loki)
  # ----------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:2.9.8
    container_name: pet-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - app_logs:/var/log/app:ro
      - nginx_logs:/var/log/nginx:ro
    networks:
      - monitor-net
    depends_on:
      - loki
